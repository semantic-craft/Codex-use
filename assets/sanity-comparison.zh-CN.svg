<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Codex-use：怕犯错的 GPT 终端小方块 vs 乐观自信的 Gemini 星芒教练</title>
  <desc id="desc">原创动画对比：左侧展示怕犯错、拒绝干活的 Codex 终端小方块让人陷入 AI 脑雾；右侧展示乐观自信的 Gemini 星芒教练在隔离 worktree 里鼓励 Codex 放心干活并用 JSONL 验真，让人保持好心情。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#151e34"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#271522"/>
      <stop offset="100%" stop-color="#17111e"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12233b"/>
      <stop offset="100%" stop-color="#0f1b2c"/>
    </linearGradient>
    <linearGradient id="geminiStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="codexWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2234"/>
      <stop offset="100%" stop-color="#261626"/>
    </linearGradient>
    <linearGradient id="codexCalm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143b36"/>
      <stop offset="100%" stop-color="#0f282a"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60a5fa" flood-opacity="0.55"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#030712" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-weight: 700; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'PingFang SC', Menlo, monospace; }

      @keyframes shiver {
        0%, 100% { transform: translate(0px, 0px); }
        25% { transform: translate(-1.6px, 0.5px); }
        50% { transform: translate(1.6px, -0.5px); }
        75% { transform: translate(-1px, 0px); }
      }
      @keyframes sweatDrop {
        0%, 100% { transform: translateY(0px); opacity: 0.95; }
        70% { transform: translateY(7px); opacity: 0.2; }
      }
      @keyframes warnPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes floatStar {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes flowBeam {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes happyNod {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      .shiver { animation: shiver 0.65s ease-in-out infinite; }
      .sweat { animation: sweatDrop 1.7s ease-in-out infinite; }
      .warn { animation: warnPulse 1.5s ease-in-out infinite; }
      .floatStar { transform-box: fill-box; transform-origin: center; animation: floatStar 2.6s ease-in-out infinite; }
      .beam { stroke-dasharray: 6 6; animation: flowBeam 1s linear infinite; }
      .star1 { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
      .star2 { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out 0.8s infinite; }
      .nod { animation: happyNod 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="470" rx="20" fill="url(#bg)"/>

  <!-- Header -->
  <text x="480" y="39" text-anchor="middle" fill="url(#wordGrad)" class="title" font-size="21">
    怕犯错的内向打工人，遇上乐观自信的 Gemini 教练
  </text>
  <text x="480" y="61" text-anchor="middle" fill="#94a3b8" class="body" font-size="13">
    让乐观自信的 Gemini / Antigravity / Grok / DSH 替你鼓励并管好 Codex，把好心情留给自己
  </text>

  <!-- ==================== LEFT PANEL: BEFORE ==================== -->
  <rect x="28" y="82" width="436" height="360" rx="16" fill="url(#leftCard)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="46" y="98" width="168" height="26" rx="13" fill="#f43f5e" fill-opacity="0.18"/>
  <text x="130" y="115" text-anchor="middle" fill="#fda4af" class="title" font-size="11.5">改造前 · 直接和 GPT 硬聊</text>

  <!-- Shy anxious terminal-cube Codex character -->
  <g class="shiver">
    <rect x="52" y="142" width="156" height="114" rx="14" fill="#211320" stroke="#fb7185" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="130" y="160" text-anchor="middle" fill="#fda4af" class="title" font-size="11">Codex / GPT</text>
    <rect x="100" y="172" width="60" height="52" rx="12" fill="url(#codexWarn)" stroke="#fb7185" stroke-width="1.8" filter="url(#softShadow)"/>
    <circle cx="110" cy="180" r="2" fill="#fb7185" fill-opacity="0.8"/>
    <circle cx="117" cy="180" r="2" fill="#fbbf24" fill-opacity="0.8"/>
    <text x="148" y="183" text-anchor="end" fill="#fda4af" class="mono" font-size="8.5">&gt;_</text>
    <circle cx="120" cy="197" r="3" fill="#fecdd3"/>
    <circle cx="140" cy="197" r="3" fill="#fecdd3"/>
    <path d="M116 190 L124 192 M144 190 L136 192" stroke="#fda4af" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M120 211 Q125 207 130 211 Q135 207 140 211" fill="none" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
    <path class="sweat" d="M166 177 C166 177 171 184 171 187.5 C171 190.3 168.8 192.5 166 192.5 C163.2 192.5 161 190.3 161 187.5 C161 184 166 177 166 177 Z" fill="#38bdf8"/>
    <text x="130" y="245" text-anchor="middle" fill="#fecdd3" class="body" font-size="10">“怕改坏，请先确认…”</text>
  </g>

  <!-- Friction -->
  <text x="246" y="191" text-anchor="middle" fill="#fb7185" class="title" font-size="18">⇄</text>
  <text x="246" y="209" text-anchor="middle" fill="#fda4af" class="body" font-size="10">来回拉扯</text>
  <text x="246" y="222" text-anchor="middle" fill="#fda4af" class="body" font-size="10">精神内耗</text>

  <!-- Stressed Human -->
  <rect x="284" y="142" width="160" height="114" rx="14" fill="#211320" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="364" y="160" text-anchor="middle" fill="#fcd34d" class="title" font-size="11">你（亲自监工）</text>
  <circle cx="364" cy="197" r="24" fill="#361a26" stroke="#fb7185" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M353 191 L359 195 M359 191 L353 195 M369 191 L375 195 M375 191 L369 195" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  <path d="M354 209 Q364 201 374 209" fill="none" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  <path class="warn" d="M396 177 L389 189 L396 189 L390 201" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="364" y="245" text-anchor="middle" fill="#fde68a" class="body" font-size="10">“求你直接把测试跑完！”</text>

  <!-- Failure list -->
  <rect x="48" y="270" width="396" height="86" rx="10" fill="#231624" stroke="#f43f5e" stroke-opacity="0.32" stroke-width="1"/>
  <text x="64" y="292" fill="#fecdd3" class="body" font-size="11.5">• 拒绝干活甩锅：“以下是建议下一步，你可以自己运行…”</text>
  <text x="64" y="312" fill="#fecdd3" class="body" font-size="11.5">• 过度防御堆垫片 + 臭名昭著的说教官腔与黑话简写</text>
  <text x="64" y="332" fill="#fecdd3" class="body" font-size="11.5">• 工作区改脏 + 口头宣称通过却不给真实退出码证据</text>

  <!-- Result banner left -->
  <rect x="48" y="370" width="396" height="54" rx="10" fill="#f43f5e" fill-opacity="0.14"/>
  <text x="64" y="392" fill="#fda4af" class="title" font-size="13">结果：AI 脑雾耗竭，干完活心情更差</text>
  <text x="64" y="411" fill="#e2e8f0" class="body" font-size="11.5">客观认知负荷 +11.2%（CSU '26） · 实测慢 19%（METR '25）</text>

  <!-- ==================== RIGHT PANEL: AFTER ==================== -->
  <rect x="496" y="82" width="436" height="360" rx="16" fill="url(#rightCard)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="514" y="98" width="176" height="26" rx="13" fill="#3b82f6" fill-opacity="0.22"/>
  <text x="602" y="115" text-anchor="middle" fill="#93c5fd" class="title" font-size="11.5">改造后 · 装上 Codex-use</text>

  <!-- Original Smiling Radiant Gemini Four-Point Star Coach -->
  <rect x="514" y="142" width="166" height="114" rx="14" fill="#11223d" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.4"/>
  <text x="597" y="160" text-anchor="middle" fill="#93c5fd" class="title" font-size="11">Gemini / 主 Agent 教练</text>
  <g class="floatStar">
    <path d="M597 166 C601 184 611 194 629 198 C611 202 601 212 597 230 C593 212 583 202 565 198 C583 194 593 184 597 166 Z" fill="url(#geminiStar)" filter="url(#glowBlue)"/>
    <circle cx="591" cy="195" r="2.2" fill="#0b1120"/>
    <circle cx="603" cy="195" r="2.2" fill="#0b1120"/>
    <path d="M590 202 Q597 208 604 202" fill="none" stroke="#0b1120" stroke-width="2" stroke-linecap="round"/>
    <path class="star1" d="M635 174 L637.5 179.5 L643 182 L637.5 184.5 L635 190 L632.5 184.5 L627 182 L632.5 179.5 Z" fill="#fde047"/>
    <path class="star2" d="M558 179 L559.8 183 L563.8 184.8 L559.8 186.6 L558 190.6 L556.2 186.6 L552.2 184.8 L556.2 183 Z" fill="#34d399"/>
  </g>
  <text x="597" y="245" text-anchor="middle" fill="#bfdbfe" class="body" font-size="10">“隔离区兜底，放心干！”</text>

  <!-- Animated encouragement beam -->
  <line class="beam" x1="684" y1="197" x2="742" y2="197" stroke="#34d399" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="746,197 738,192 738,202" fill="#34d399"/>
  <text x="714" y="185" text-anchor="middle" fill="#6ee7b7" class="title" font-size="9.5">正向鼓励</text>
  <text x="714" y="215" text-anchor="middle" fill="#6ee7b7" class="title" font-size="9.5">硬门禁</text>

  <!-- Reassured happy terminal-cube Codex character -->
  <rect x="750" y="142" width="164" height="114" rx="14" fill="#102630" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.3"/>
  <text x="832" y="160" text-anchor="middle" fill="#6ee7b7" class="title" font-size="11">Codex（支棱起来）</text>
  <g class="nod">
    <rect x="802" y="172" width="60" height="52" rx="12" fill="url(#codexCalm)" stroke="#34d399" stroke-width="1.8" filter="url(#softShadow)"/>
    <circle cx="812" cy="180" r="2" fill="#34d399"/>
    <circle cx="819" cy="180" r="2" fill="#60a5fa"/>
    <text x="850" y="183" text-anchor="end" fill="#6ee7b7" class="mono" font-size="8.5">&gt;_</text>
    <path d="M817 198 Q821 193 825 198 M839 198 Q843 193 847 198" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/>
    <path d="M823 207 Q832 214 841 207" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="865" cy="175" r="9.5" fill="#10b981"/>
    <path d="M860.5 175 L863.5 178 L869.5 171.5" fill="none" stroke="#052e1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="832" y="245" text-anchor="middle" fill="#a7f3d0" class="mono" font-size="9.5">“exit_code: 0 · 搞定！”</text>

  <!-- Clean pipeline summary -->
  <rect x="516" y="270" width="396" height="86" rx="10" fill="#0f1e33" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1"/>
  <text x="532" y="292" fill="#dbeafe" class="body" font-size="11.5">• 消除畏缩：隔离 git worktree + 基线 commit 安全兜底</text>
  <text x="532" y="312" fill="#dbeafe" class="body" font-size="11.5">• 任选 --model（gpt-6.2-astra / sol）+ JSONL 实跑验真</text>
  <text x="532" y="332" fill="#dbeafe" class="body" font-size="11.5">• 宿主把结果翻译成清爽人话，省心省脑</text>

  <!-- Happy Human banner right -->
  <rect x="516" y="370" width="396" height="54" rx="10" fill="#10b981" fill-opacity="0.16"/>
  <g class="nod">
    <circle cx="546" cy="397" r="16" fill="#10382e" stroke="#34d399" stroke-width="2"/>
    <circle cx="541" cy="393" r="2" fill="#6ee7b7"/>
    <circle cx="551" cy="393" r="2" fill="#6ee7b7"/>
    <path d="M539 400 Q546 407 553 400" fill="none" stroke="#6ee7b7" stroke-width="2.1" stroke-linecap="round"/>
  </g>
  <text x="574" y="392" fill="#6ee7b7" class="title" font-size="13">结果：干净 Diff、脑子清爽、心情大好</text>
  <text x="574" y="411" fill="#e2e8f0" class="body" font-size="11.5">告别直接盯梢 Codex · 轻量框架略改即可适配任意机器</text>
</svg>
