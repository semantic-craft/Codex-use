<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Codex-use: Anxious Direct Codex Chat vs Upbeat Host-Coached Workflow</title>
  <desc id="desc">Animated comparison showing a hesitant, mistake-averse Codex stalling in direct human chat versus an upbeat, confident host agent like Gemini encouraging Codex inside an isolated git worktree with JSONL verification, leaving the human calm and happy.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1622"/>
      <stop offset="100%" stop-color="#191320"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10292b"/>
      <stop offset="100%" stop-color="#111d29"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes shiver {
        0%, 100% { transform: translate(0px, 0px); }
        25% { transform: translate(-1.5px, 0.5px); }
        50% { transform: translate(1.5px, -0.5px); }
        75% { transform: translate(-1px, 0px); }
      }
      @keyframes sweatDrop {
        0%, 100% { transform: translateY(0px); opacity: 0.9; }
        70% { transform: translateY(6px); opacity: 0.25; }
      }
      @keyframes warnPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes coachGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.06); }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes gentleBounce {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes checkPop {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      .shiver { animation: shiver 0.7s ease-in-out infinite; }
      .sweat { animation: sweatDrop 1.8s ease-in-out infinite; }
      .warn { animation: warnPulse 1.6s ease-in-out infinite; }
      .glow { transform-box: fill-box; transform-origin: center; animation: coachGlow 2.4s ease-in-out infinite; }
      .flow { stroke-dasharray: 6 6; animation: flowDash 1.1s linear infinite; }
      .spark1 { transform-box: fill-box; transform-origin: center; animation: sparkle 1.8s ease-in-out infinite; }
      .spark2 { transform-box: fill-box; transform-origin: center; animation: sparkle 1.8s ease-in-out 0.9s infinite; }
      .bounce { animation: gentleBounce 2.6s ease-in-out infinite; }
      .check { animation: checkPop 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="460" rx="18" fill="url(#bg)"/>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" class="title" font-size="20">
    Anxious Worker Meets an Optimistic Coach
  </text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" class="body" font-size="13">
    Let a confident host agent (Gemini / Antigravity / Grok / DSH) cheer on Codex so you stay sane and happy
  </text>

  <!-- ==================== LEFT PANEL: BEFORE ==================== -->
  <rect x="28" y="80" width="436" height="352" rx="14" fill="url(#leftCard)" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="46" y="96" width="174" height="26" rx="13" fill="#f43f5e" fill-opacity="0.18"/>
  <text x="133" y="113" text-anchor="middle" fill="#fda4af" class="title" font-size="11.5">BEFORE · DIRECT GPT CHAT</text>

  <!-- Anxious Codex bot (shivering in corner) -->
  <g class="shiver">
    <rect x="54" y="142" width="152" height="104" rx="12" fill="#231623" stroke="#fb7185" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="130" y="160" text-anchor="middle" fill="#fda4af" class="title" font-size="11">Codex / GPT</text>
    <text x="130" y="174" text-anchor="middle" fill="#94a3b8" class="body" font-size="10">Shy · Fearful of mistakes</text>
    <!-- Nervous bot face -->
    <rect x="106" y="184" width="48" height="38" rx="9" fill="#331c2b" stroke="#fb7185" stroke-width="1.6"/>
    <circle cx="121" cy="199" r="3" fill="#fecdd3"/>
    <circle cx="139" cy="199" r="3" fill="#fecdd3"/>
    <path d="M119 212 Q125 208 130 212 Q135 208 141 212" fill="none" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Sweat drop -->
    <path class="sweat" d="M159 186 C159 186 164 193 164 196 C164 199 161.8 201 159 201 C156.2 201 154 199 154 196 C154 193 159 186 159 186 Z" fill="#38bdf8"/>
    <text x="130" y="236" text-anchor="middle" fill="#fecdd3" class="mono" font-size="9.5">"May break something..."</text>
  </g>

  <!-- Friction arrows between Codex and Human -->
  <text x="246" y="185" text-anchor="middle" fill="#fb7185" class="title" font-size="18">⇄</text>
  <text x="246" y="203" text-anchor="middle" fill="#fda4af" class="body" font-size="10">Endless</text>
  <text x="246" y="216" text-anchor="middle" fill="#fda4af" class="body" font-size="10">tug-of-war</text>

  <!-- Stressed Human -->
  <rect x="286" y="142" width="158" height="104" rx="12" fill="#231623" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="365" y="160" text-anchor="middle" fill="#fcd34d" class="title" font-size="11">You (Human)</text>
  <text x="365" y="174" text-anchor="middle" fill="#94a3b8" class="body" font-size="10">Babysitting every turn</text>
  <!-- Stressed face + lightning -->
  <circle cx="365" cy="203" r="20" fill="#3b1d28" stroke="#fb7185" stroke-width="1.8"/>
  <path d="M356 198 L361 201 M361 198 L356 201 M369 198 L374 201 M374 198 L369 201" stroke="#fda4af" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M357 212 Q365 206 373 212" fill="none" stroke="#fda4af" stroke-width="1.9" stroke-linecap="round"/>
  <path class="warn" d="M393 185 L387 195 L393 195 L388 205" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="365" y="236" text-anchor="middle" fill="#fde68a" class="mono" font-size="9.5">"Just finish the fix!"</text>

  <!-- Cryptic bubble log -->
  <rect x="48" y="262" width="396" height="84" rx="10" fill="#251722" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="64" y="283" fill="#fecdd3" class="mono" font-size="11">• "Suggested next steps: you can run pytest..."</text>
  <text x="64" y="303" fill="#fecdd3" class="mono" font-size="11">• Cryptic reasoning shorthand &amp; hesitant hedging</text>
  <text x="64" y="323" fill="#fecdd3" class="mono" font-size="11">• Defensive shims + dirty tree + unverified prose</text>

  <!-- Result banner left -->
  <rect x="48" y="360" width="396" height="54" rx="10" fill="#f43f5e" fill-opacity="0.14"/>
  <text x="64" y="382" fill="#fda4af" class="title" font-size="13">Result: AI Brain Fry &amp; Drained Mood</text>
  <text x="64" y="401" fill="#e2e8f0" class="body" font-size="11.5">+11.2% cognitive load (CSU '26) · +19% slower (METR '25)</text>

  <!-- ==================== RIGHT PANEL: AFTER ==================== -->
  <rect x="496" y="80" width="436" height="352" rx="14" fill="url(#rightCard)" stroke="#10b981" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="514" y="96" width="184" height="26" rx="13" fill="#10b981" fill-opacity="0.2"/>
  <text x="606" y="113" text-anchor="middle" fill="#6ee7b7" class="title" font-size="11.5">AFTER · WITH CODEX-USE</text>

  <!-- Confident Optimistic Gemini / Host Coach -->
  <rect x="516" y="142" width="164" height="104" rx="12" fill="#112936" stroke="url(#geminiGrad)" stroke-width="1.6"/>
  <circle class="glow" cx="598" cy="197" r="26" fill="url(#geminiGrad)" fill-opacity="0.22"/>
  <text x="598" y="160" text-anchor="middle" fill="#93c5fd" class="title" font-size="11">Gemini / Host Coach</text>
  <text x="598" y="174" text-anchor="middle" fill="#a7f3d0" class="body" font-size="10">Optimistic · Confident</text>
  <!-- Gemini 4-point star + big smile -->
  <g class="bounce">
    <circle cx="598" cy="201" r="18" fill="#173847" stroke="url(#geminiGrad)" stroke-width="2"/>
    <circle cx="592" cy="197" r="2.2" fill="#e0f2fe"/>
    <circle cx="604" cy="197" r="2.2" fill="#e0f2fe"/>
    <path d="M590 205 Q598 213 606 205" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Sparkles -->
    <path class="spark1" d="M624 182 L626 187 L631 189 L626 191 L624 196 L622 191 L617 189 L622 187 Z" fill="#60a5fa"/>
    <path class="spark2" d="M570 186 L571.5 189.5 L575 191 L571.5 192.5 L570 196 L568.5 192.5 L565 191 L568.5 189.5 Z" fill="#34d399"/>
  </g>
  <text x="598" y="236" text-anchor="middle" fill="#bae6fd" class="mono" font-size="9.5">"Worktree's safe, ship it!"</text>

  <!-- Animated encouragement beam -->
  <line class="flow" x1="684" y1="194" x2="742" y2="194" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="746,194 738,189 738,199" fill="#34d399"/>
  <text x="714" y="182" text-anchor="middle" fill="#6ee7b7" class="title" font-size="9.5">Cheer &amp;</text>
  <text x="714" y="212" text-anchor="middle" fill="#6ee7b7" class="title" font-size="9.5">Guardrails</text>

  <!-- Reassured Codex shipping cleanly -->
  <rect x="750" y="142" width="162" height="104" rx="12" fill="#102926" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.3"/>
  <text x="831" y="160" text-anchor="middle" fill="#6ee7b7" class="title" font-size="11">Codex (Reassured)</text>
  <text x="831" y="174" text-anchor="middle" fill="#94a3b8" class="body" font-size="10">Locked worktree + JSONL</text>
  <rect x="807" y="184" width="48" height="38" rx="9" fill="#133830" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="822" cy="199" r="2.6" fill="#d1fae5"/>
  <circle cx="840" cy="199" r="2.6" fill="#d1fae5"/>
  <path d="M821 209 Q831 215 841 209" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
  <!-- Green checkmark badge -->
  <g class="check">
    <circle cx="863" cy="190" r="9" fill="#10b981"/>
    <path d="M859 190 L862 193 L867 187" fill="none" stroke="#06281e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="831" y="236" text-anchor="middle" fill="#a7f3d0" class="mono" font-size="9.5">"exit_code: 0 · done!"</text>

  <!-- Clean pipeline summary -->
  <rect x="516" y="262" width="396" height="84" rx="10" fill="#0e2328" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
  <text x="532" y="283" fill="#d1fae5" class="mono" font-size="11">• Host removes fear: isolated worktree + baseline SHA</text>
  <text x="532" y="303" fill="#d1fae5" class="mono" font-size="11">• Any --model (gpt-6.2-astra / sol) + JSONL exit audit</text>
  <text x="532" y="323" fill="#d1fae5" class="mono" font-size="11">• Host translates output into clear, warm human prose</text>

  <!-- Happy Human banner right -->
  <rect x="516" y="360" width="396" height="54" rx="10" fill="#10b981" fill-opacity="0.16"/>
  <g class="bounce">
    <circle cx="546" cy="387" r="16" fill="#10382e" stroke="#34d399" stroke-width="2"/>
    <circle cx="541" cy="383" r="1.9" fill="#6ee7b7"/>
    <circle cx="551" cy="383" r="1.9" fill="#6ee7b7"/>
    <path d="M539 390 Q546 397 553 390" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="574" y="382" fill="#6ee7b7" class="title" font-size="13">Result: Clean Diff, Calm Mind, Happy You</text>
  <text x="574" y="401" fill="#e2e8f0" class="body" font-size="11.5">Zero direct Codex babysitting · Hackable for any machine</text>
</svg>
