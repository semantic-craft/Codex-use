<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex-use: Direct GPT/Codex Chat vs Agent-Buffered Workflow</title>
  <desc id="desc">Comparison showing cognitive fatigue from directly babysitting Codex CLI versus a calmer, happier workflow where a host agent drives Codex via Codex-use with isolated worktrees and JSONL verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b1822"/>
      <stop offset="100%" stop-color="#1c1520"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122b29"/>
      <stop offset="100%" stop-color="#131f28"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="18" fill="url(#bg)"/>

  <text x="480" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700">
    Protect Your Sanity: Put an Agent Between You and Codex
  </text>
  <text x="480" y="62" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
    Keep GPT's coding muscle (--model gpt-6.2-astra / sol) without babysitting its cryptic prose
  </text>

  <!-- Left Panel: Before -->
  <rect x="28" y="82" width="436" height="292" rx="14" fill="url(#leftCard)" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="46" y="98" width="166" height="26" rx="13" fill="#f43f5e" fill-opacity="0.18"/>
  <text x="129" y="115" text-anchor="middle" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">BEFORE · DIRECT CHAT</text>

  <!-- Stressed face -->
  <circle cx="424" cy="116" r="20" fill="#3f1d2b" stroke="#fb7185" stroke-width="2"/>
  <path d="M415 111 L420 114 M420 111 L415 114 M428 111 L433 114 M433 111 L428 114" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M416 125 Q424 119 432 125" fill="none" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>

  <!-- Flow boxes left -->
  <rect x="48" y="144" width="396" height="44" rx="8" fill="#1f2937" stroke="#475569" stroke-width="1"/>
  <text x="64" y="163" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">You argue directly with GPT / Codex</text>
  <text x="64" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Re-prompting, chasing premature stops, decoding terse jargon</text>

  <text x="246" y="205" text-anchor="middle" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700">↓</text>

  <rect x="48" y="214" width="396" height="72" rx="8" fill="#271a24" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="64" y="235" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• "Suggested next steps: you can run pytest..."</text>
  <text x="64" y="254" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Unrequested abstractions + dirty working tree</text>
  <text x="64" y="273" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Prose claims "tests pass" with no exit-code proof</text>

  <rect x="48" y="302" width="396" height="54" rx="8" fill="#f43f5e" fill-opacity="0.14"/>
  <text x="64" y="324" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Result: AI Brain Fry &amp; Verification Fatigue</text>
  <text x="64" y="343" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">+11.2% cognitive load (CSU '26) · +19% slower (METR '25) · Drained mood</text>

  <!-- Right Panel: After -->
  <rect x="496" y="82" width="436" height="292" rx="14" fill="url(#rightCard)" stroke="#10b981" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="514" y="98" width="176" height="26" rx="13" fill="#10b981" fill-opacity="0.2"/>
  <text x="602" y="115" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">AFTER · WITH CODEX-USE</text>

  <!-- Happy face -->
  <circle cx="892" cy="116" r="20" fill="#10332b" stroke="#34d399" stroke-width="2"/>
  <circle cx="885" cy="112" r="2.2" fill="#6ee7b7"/>
  <circle cx="899" cy="112" r="2.2" fill="#6ee7b7"/>
  <path d="M883 121 Q892 129 901 121" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Flow boxes right -->
  <rect x="516" y="144" width="396" height="44" rx="8" fill="#132a2e" stroke="#34d399" stroke-opacity="0.45" stroke-width="1"/>
  <text x="532" y="163" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">You talk naturally to your favorite Host Agent</text>
  <text x="532" y="180" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Antigravity · Grok Bot · DSH · Claude Code · Any SKILL.md agent</text>

  <text x="714" y="205" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700">↓</text>

  <rect x="516" y="214" width="396" height="72" rx="8" fill="#0f2529" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
  <text x="532" y="235" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Locked git worktree + --model &lt;any-gpt&gt; + strict schema</text>
  <text x="532" y="254" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• JSONL audits real commands &amp; exit codes automatically</text>
  <text x="532" y="273" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Host translates results into clear, human-friendly prose</text>

  <rect x="516" y="302" width="396" height="54" rx="8" fill="#10b981" fill-opacity="0.16"/>
  <text x="532" y="324" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Result: Clean Diff, Calm Mind, Better Mood</text>
  <text x="532" y="343" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Zero direct Codex babysitting · Lightly hackable for any machine</text>
</svg>
